[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-defence-rag"
version = "0.1.0"
description = "ADR-002 M1: traceable B1 single-round RAG baseline"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<0.116",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
runtime = ["chromadb>=1.0,<2", "groq>=0.30,<1", "pymupdf>=1.24,<2", "sentence-transformers>=3,<6", "huggingface-hub>=0.20,<2", "python-dotenv>=1,<2"]
notebook = ["jupyterlab>=4,<5"]
historical = ["pandas", "openpyxl"]

[project.scripts]
phishing-rag = "phishing_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
